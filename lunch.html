<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>점심 룰렛</title>
<!-- 글꼴: Noto Sans KR (jsdelivr CDN, Fontsource 패키지) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/900.css">
<style>
  /* =========================================================
     1. 색상·글꼴 토큰
     - 눈이 편한 연한 세이지(녹회색) 바탕 + 차분한 짙은 초록 포인트
     - 쨍한 흰색과 원색을 피해서 오래 봐도 피로하지 않게 맞춤
     ========================================================= */
  :root {
    --bg: #EEF1E8;           /* 화면 바탕(연한 세이지) */
    --card: #FAFBF6;         /* 카드 바탕(따뜻한 미색) */
    --card-border: #DDE3D6;  /* 카드 테두리 */
    --accent: #2F5D50;       /* 포인트 색(짙은 초록) */
    --accent-dark: #234A3F;  /* 버튼에 마우스를 올렸을 때 */
    --accent-soft: #E2EADF;  /* 연한 포인트 바탕 */
    --ink: #2A3530;          /* 기본 글씨(순수 검정 대신 부드러운 짙은 색) */
    --ink-soft: #66736C;     /* 보조 글씨 */
    --line: #E3E8DD;         /* 목록 구분선 */
    --warn: #B4532A;         /* 안내 문구(차분한 주황 갈색) */
    --overlay: rgba(35, 52, 45, 0.45);
    --shadow: 0 6px 24px rgba(47, 77, 66, 0.08);
    --radius: 20px;
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    /* 휴대폰 상단·하단 시스템 영역에 내용이 가리지 않도록 여백 */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* =========================================================
     2. 전체 레이아웃
     ========================================================= */
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 20px 32px;
  }

  /* 맨 위 왼쪽 "업무 도구 모음" 돌아가기 링크 */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    margin-left: -12px;
    border-radius: 999px;
    color: var(--accent);
    font-size: .95rem;
    font-weight: 500;
    text-decoration: none;
  }
  .back-link:hover { background: var(--accent-soft); }
  .back-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header { margin: 14px 0 22px; }
  header h1 {
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 900;
    line-height: 1.2;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  header p { margin: 6px 0 0; color: var(--ink-soft); }

  /* PC: 왼쪽 메뉴 입력(고정 폭) + 오른쪽 룰렛(나머지) */
  .main {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: 20px;
    align-items: start;
  }

  /* 공통 카드: 둥근 모서리 + 얇은 테두리 + 은은한 그림자 */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
  }

  /* =========================================================
     3. 버튼 공통
     ========================================================= */
  button {
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card);
    color: var(--accent);
    padding: 8px 14px;
    transition: background .15s ease, transform .08s ease;
  }
  button:not(:disabled):hover { background: var(--accent-soft); }
  button:not(:disabled):active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid rgba(47, 93, 80, 0.35);
    outline-offset: 2px;
  }

  /* 포인트 색으로 채운 주요 버튼 */
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #FAFBF6;
  }
  .btn-primary:not(:disabled):hover { background: var(--accent-dark); }

  /* =========================================================
     4. 메뉴 입력 영역
     ========================================================= */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row input::placeholder { color: #9AA79F; }
  .add-row input:disabled { background: #EEF1E8; }
  .btn-add { padding: 10px 16px; }

  /* 안내 문구 자리(높이를 미리 잡아 두어 화면이 출렁이지 않게) */
  .notice {
    min-height: 1.6em;
    margin: 8px 2px 4px;
    font-size: .9rem;
    font-weight: 500;
    color: var(--warn);
  }

  .count-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 0 8px;
  }
  .count { color: var(--ink-soft); font-size: .95rem; }
  .count b { color: var(--accent); font-size: 1.1rem; font-weight: 700; }

  .menu-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .menu-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .menu-list li:last-child { border-bottom: 0; }
  /* 목록 왼쪽의 색 동그라미 = 룰렛 칸 색 */
  .swatch {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex: none;
    box-shadow: inset 0 0 0 1px rgba(42, 53, 48, 0.18);
  }
  .menu-name {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    font-weight: 500;
  }
  .btn-del { padding: 4px 10px; font-size: .85rem; color: var(--ink-soft); }
  .empty {
    padding: 18px 4px;
    color: var(--ink-soft);
  }

  /* =========================================================
     5. 룰렛 영역
     ========================================================= */
  .stage-card { display: flex; flex-direction: column; align-items: center; }

  /* 룰렛 + 카운트다운을 가로로 나란히 */
  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 100%;
  }
  .wheel-box {
    position: relative;
    width: min(500px, 100%);
    aspect-ratio: 1 / 1;
    padding-top: 26px; /* 화살표 자리 */
  }
  #wheel {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* 위쪽 가운데에 고정된 화살표 ▼ */
  .pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    line-height: 1;
    color: var(--accent);
    /* 밝은 테두리처럼 보이도록 글자 그림자 */
    text-shadow:
      -2px 0 #FAFBF6, 2px 0 #FAFBF6, 0 -2px #FAFBF6, 0 3px rgba(47, 77, 66, 0.25);
    z-index: 2;
    pointer-events: none;
  }

  /* 카운트다운 숫자 */
  .countdown {
    width: 96px;
    text-align: center;
    font-size: 5.5rem;
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    visibility: hidden;
  }
  .countdown.show { visibility: visible; }
  .countdown.pop { animation: pop .35s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1.6); opacity: .3; }
    100% { transform: scale(1);   opacity: 1; }
  }

  .btn-start {
    margin-top: 22px;
    min-width: 240px;
    padding: 15px 28px;
    font-size: 1.25rem;
    font-weight: 700;
    border-radius: 16px;
    box-shadow: 0 6px 16px rgba(47, 93, 80, 0.22);
  }
  .stage-card .notice { text-align: center; }

  /* =========================================================
     6. 최근 결과 기록
     ========================================================= */
  .history { margin-top: 20px; }
  .history ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history li {
    border-radius: 999px;
    padding: 6px 14px;
    font-weight: 500;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .history li time { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .history li.empty { padding: 0; background: none; color: var(--ink-soft); }

  /* =========================================================
     7. 결과 팝업
     ========================================================= */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .modal {
    width: min(440px, 100%);
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(35, 52, 45, 0.25);
    padding: 34px 26px 26px;
    text-align: center;
    animation: modal-in .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes modal-in {
    from { transform: scale(.6); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }
  .modal p { margin: 0; color: var(--ink-soft); font-weight: 500; }
  .modal h2 {
    margin: 8px 0 26px;
    font-size: clamp(1.7rem, 7vw, 2.3rem);
    font-weight: 900;
    line-height: 1.3;
    color: var(--accent);
    overflow-wrap: anywhere;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .modal-actions button { padding: 12px 22px; font-size: 1rem; }

  /* 꽃가루용 전체 화면 캔버스(클릭은 통과) */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  /* 맨 아래 안내 문구 */
  .site-footer {
    margin-top: 28px;
    text-align: center;
    font-size: .8rem;
    color: #8C978F;
  }

  /* 화면 낭독기 전용(눈에는 안 보임) */
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* =========================================================
     8. 휴대폰 화면: 위아래 배치
     ========================================================= */
  @media (max-width: 820px) {
    .main { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 12px 16px 28px; }
    .card { padding: 18px; border-radius: 18px; }
    /* 좁은 화면에서는 카운트다운을 룰렛 왼쪽 위 모서리에 겹쳐 표시 */
    .countdown {
      position: absolute;
      top: 0;
      left: 0;
      width: auto;
      font-size: 3.8rem;
      z-index: 3;
      text-shadow: 0 0 6px #FAFBF6, 0 0 12px #FAFBF6;
    }
    .btn-start { width: 100%; min-width: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .modal, .countdown.pop { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 맨 위 왼쪽: 업무 도구 모음으로 돌아가기 -->
  <nav aria-label="상위 메뉴">
    <a class="back-link" href="index.html">← 업무 도구 모음</a>
  </nav>

  <header>
    <h1>점심 룰렛</h1>
    <p>오늘 뭐 먹을지 고민될 때, 메뉴를 넣고 돌려 보세요.</p>
  </header>

  <main class="main">
    <!-- ===== 왼쪽: 메뉴 입력 ===== -->
    <section class="card" aria-labelledby="menu-title">
      <h2 id="menu-title">메뉴 고르기</h2>

      <div class="add-row">
        <label for="menu-input" class="sr-only">메뉴 이름</label>
        <input id="menu-input" type="text" maxlength="12" placeholder="메뉴 이름 (예: 칼국수)" autocomplete="off">
        <button id="btn-add" class="btn-add btn-primary" type="button">추가</button>
      </div>
      <div id="menu-notice" class="notice" role="status" aria-live="polite"></div>

      <div class="count-row">
        <span class="count" id="menu-count">현재 0 / 10개</span>
        <button id="btn-clear" type="button">전체 삭제</button>
      </div>

      <ul id="menu-list" class="menu-list"></ul>
    </section>

    <!-- ===== 오른쪽: 룰렛 ===== -->
    <section class="card stage-card" aria-label="룰렛">
      <div class="stage">
        <div class="wheel-box">
          <div class="pointer" aria-hidden="true">▼</div>
          <canvas id="wheel" role="img" aria-label="점심 메뉴 룰렛"></canvas>
        </div>
        <div id="countdown" class="countdown" aria-live="off"></div>
      </div>

      <button id="btn-start" class="btn-start btn-primary" type="button">룰렛 시작</button>
      <div id="spin-notice" class="notice" role="status" aria-live="polite"></div>
    </section>
  </main>

  <!-- ===== 아래: 최근 결과 기록 ===== -->
  <section class="card history" aria-labelledby="history-title">
    <h2 id="history-title">최근 결과</h2>
    <ol id="history-list"></ol>
  </section>

  <!-- 맨 아래 개인정보 안내 -->
  <footer class="site-footer">
    입력한 내용은 이 브라우저 안에서만 처리되며 어디에도 저장·전송되지 않습니다.
  </footer>
</div>

<!-- ===== 결과 팝업 ===== -->
<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="result-text">
    <p>룰렛이 골랐어요</p>
    <h2 id="result-text"></h2>
    <div class="modal-actions">
      <button id="btn-again" class="btn-primary" type="button">다시 돌리기</button>
      <button id="btn-close" type="button">닫기</button>
    </div>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* =============================================================
   점심 룰렛 스크립트
   - 모든 데이터는 메모리(변수)에만 보관합니다.
   - localStorage 등 브라우저 저장소와 서버 전송은 사용하지 않습니다.
   ============================================================= */

/* ---------- 설정값 ---------- */
const MAX_MENUS = 10;            // 최대 메뉴 개수
const MIN_MENUS = 2;             // 룰렛을 돌리기 위한 최소 메뉴 개수
const SPIN_DURATION = 5000;      // 회전 시간(밀리초) = 정확히 5초
const EXTRA_TURNS = 8;           // 멈추기 전까지 최소로 도는 바퀴 수
const HISTORY_SIZE = 5;          // 기록에 남길 최근 결과 개수
const TAU = Math.PI * 2;         // 한 바퀴(360도)를 라디안으로
const ACCENT = "#2F5D50";        // 포인트 색(차분한 짙은 초록)
const DEEP_TEXT = "#24433A";     // 밝은 칸 위에 쓰는 글자색
const LIGHT_TEXT = "#FAFBF6";    // 어두운 칸 위에 쓰는 글자색
const CARD = "#FAFBF6";          // 카드 바탕색(칸 경계선·가운데 판에 사용)
const FONT = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

// 룰렛 칸 색상 10가지 (채도를 낮춘 자연 톤, 이웃한 칸끼리 밝기가 엇갈리게 배치)
// text: 그 칸 위에 쓸 글자색(어두운 칸은 밝은 글씨, 밝은 칸은 짙은 초록 글씨)
const COLORS = [
  { fill: "#2F5D50", text: LIGHT_TEXT }, // 짙은 초록
  { fill: "#E7C987", text: DEEP_TEXT },  // 모래색
  { fill: "#5E8C7C", text: LIGHT_TEXT }, // 세이지 청록
  { fill: "#F1E3CF", text: DEEP_TEXT },  // 크림
  { fill: "#A9684A", text: LIGHT_TEXT }, // 테라코타
  { fill: "#B4CBA9", text: DEEP_TEXT },  // 세이지
  { fill: "#4F6F8F", text: LIGHT_TEXT }, // 차분한 파랑
  { fill: "#E6BBA5", text: DEEP_TEXT },  // 살구
  { fill: "#76668A", text: LIGHT_TEXT }, // 차분한 보라
  { fill: "#D6DEC6", text: DEEP_TEXT }   // 연올리브
];

/* ---------- 상태 ---------- */
const state = {
  menus: ["김치찌개", "돈가스", "비빔밥", "짜장면", "냉면"], // 처음 예시 메뉴
  history: [],      // 최근 결과 [{ time: "12:03", menu: "김치찌개" }, ...]
  spinning: false,  // 지금 룰렛이 돌고 있는지
  rotation: 0       // 현재 룰렛 회전 각도(라디안, 시계 방향이 +)
};

/* ---------- 화면 요소 ---------- */
const $ = (id) => document.getElementById(id);
const input      = $("menu-input");
const btnAdd     = $("btn-add");
const btnClear   = $("btn-clear");
const btnStart   = $("btn-start");
const listEl     = $("menu-list");
const countEl    = $("menu-count");
const menuNotice = $("menu-notice");
const spinNotice = $("spin-notice");
const countdown  = $("countdown");
const historyEl  = $("history-list");
const overlay    = $("overlay");
const resultText = $("result-text");
const btnAgain   = $("btn-again");
const btnClose   = $("btn-close");
const wheel      = $("wheel");
const wctx       = wheel.getContext("2d");

/* =============================================================
   안내 문구 처리
   - 잠깐 보였다 사라지는 안내(중복 메뉴 등)와
   - 조건이 계속되는 동안 남아 있는 안내(10개 가득 참)를 구분합니다.
   ============================================================= */
let tempMenuMsg = "";
let tempMenuTimer = null;

function showMenuNotice(msg) {
  tempMenuMsg = msg;
  clearTimeout(tempMenuTimer);
  tempMenuTimer = setTimeout(() => { tempMenuMsg = ""; renderMenuNotice(); }, 2500);
  renderMenuNotice();
}

function renderMenuNotice() {
  // 잠깐 안내가 있으면 그것을, 없으면 '가득 참' 안내를 보여 줍니다.
  if (tempMenuMsg) {
    menuNotice.textContent = tempMenuMsg;
  } else if (state.menus.length >= MAX_MENUS) {
    menuNotice.textContent = "메뉴는 최대 10개까지 입력할 수 있어요";
  } else {
    menuNotice.textContent = "";
  }
}

let spinNoticeTimer = null;
function showSpinNotice(msg) {
  spinNotice.textContent = msg;
  clearTimeout(spinNoticeTimer);
  spinNoticeTimer = setTimeout(() => { spinNotice.textContent = ""; }, 3000);
}

/* =============================================================
   메뉴 추가 / 삭제
   ============================================================= */
function addMenu() {
  if (state.spinning) return;                 // 회전 중에는 추가 불가
  const name = input.value.trim();            // 앞뒤 공백 제거

  // 빈칸이나 공백만 입력한 경우: 추가하지 않음
  if (!name) {
    input.value = "";
    input.focus();
    return;
  }
  // 최대 개수 초과 방지(입력창이 비활성화되지만 혹시 모를 경우 대비)
  if (state.menus.length >= MAX_MENUS) {
    renderMenuNotice();
    return;
  }
  // 같은 이름이 이미 있으면 추가하지 않음(영문은 대소문자 구분 없이 비교)
  const exists = state.menus.some((m) => m.toLowerCase() === name.toLowerCase());
  if (exists) {
    showMenuNotice("이미 있는 메뉴예요");
    input.select();
    return;
  }

  state.menus.push(name);
  input.value = "";
  tempMenuMsg = "";
  render();
  // 10개가 되면 입력창이 비활성화되므로, 그 전까지만 입력창에 커서를 둠
  if (!input.disabled) input.focus();
}

function deleteMenu(index) {
  if (state.spinning) return;
  state.menus.splice(index, 1);
  render();
}

function clearMenus() {
  if (state.spinning) return;
  state.menus = [];
  render();
  input.focus();
}

/* =============================================================
   화면 다시 그리기 (메뉴 목록, 개수, 버튼 상태, 룰렛)
   ============================================================= */
function render() {
  renderList();
  renderControls();
  renderMenuNotice();
  drawWheel();
}

// 메뉴 목록
function renderList() {
  listEl.innerHTML = "";
  if (state.menus.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "메뉴가 없어요. 위에서 메뉴를 추가해 주세요.";
    listEl.appendChild(li);
    return;
  }
  state.menus.forEach((name, i) => {
    const li = document.createElement("li");

    // 룰렛 칸과 같은 색의 동그라미
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = COLORS[i % COLORS.length].fill;

    // 메뉴 이름 (textContent로 넣어 HTML 태그가 실행되지 않게 함)
    const nm = document.createElement("span");
    nm.className = "menu-name";
    nm.textContent = name;

    const del = document.createElement("button");
    del.type = "button";
    del.className = "btn-del";
    del.textContent = "삭제";
    del.setAttribute("aria-label", `${name} 삭제`);
    del.disabled = state.spinning;
    del.addEventListener("click", () => deleteMenu(i));

    li.append(sw, nm, del);
    listEl.appendChild(li);
  });
}

// 개수 표시와 버튼 활성/비활성
function renderControls() {
  const n = state.menus.length;
  countEl.innerHTML = `현재 <b>${n}</b> / ${MAX_MENUS}개`;

  const full = n >= MAX_MENUS;
  input.disabled  = full || state.spinning;
  btnAdd.disabled = full || state.spinning;
  btnClear.disabled = state.spinning || n === 0;
  // [룰렛 시작]은 2개 미만이어도 누를 수 있게 두고, 누르면 안내를 보여 줌
  btnStart.disabled = state.spinning;

  // 메뉴가 2개 이상이 되면 '2개 이상 입력' 안내는 지움
  if (n >= MIN_MENUS && spinNotice.textContent) spinNotice.textContent = "";
}

/* =============================================================
   룰렛 그리기 (canvas)
   - 칸 i는 '맨 위(12시 방향)'에서 시작해 시계 방향으로 놓입니다.
   - 회전 각도(state.rotation)만큼 전체를 시계 방향으로 돌려 그립니다.
   ============================================================= */

// 화면 크기에 맞춰 캔버스 해상도를 조정 (레티나 화면에서도 선명하게)
function resizeWheel() {
  const dpr = window.devicePixelRatio || 1;
  const size = wheel.clientWidth;
  wheel.width = Math.round(size * dpr);
  wheel.height = Math.round(size * dpr);
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 이후 그리기는 CSS 픽셀 단위로
  drawWheel();
}

function drawWheel() {
  const size = wheel.clientWidth;
  if (!size) return;
  const cx = size / 2;
  const cy = size / 2;
  const radius = size / 2 - 6;               // 바깥 테두리 두께만큼 여유
  const n = state.menus.length;

  wctx.clearRect(0, 0, size, size);

  // 메뉴가 없으면 연한 회색 원과 안내 글씨만 그림
  if (n === 0) {
    wctx.beginPath();
    wctx.arc(cx, cy, radius, 0, TAU);
    wctx.fillStyle = "#E9EDE3";
    wctx.fill();
    wctx.lineWidth = 6;
    wctx.strokeStyle = ACCENT;
    wctx.stroke();
    wctx.fillStyle = "#66736C";
    wctx.font = `500 ${Math.round(size * 0.045)}px ${FONT}`;
    wctx.textAlign = "center";
    wctx.textBaseline = "middle";
    wctx.fillText("메뉴를 추가해 주세요", cx, cy);
    return;
  }

  const seg = TAU / n;                       // 한 칸의 각도
  // 캔버스의 0도는 3시 방향이므로 -90도(12시 방향)에서 시작
  const base = -Math.PI / 2 + state.rotation;

  // 1) 칸(부채꼴) 그리기 - 칸 사이는 밝은 미색 선으로 구분
  for (let i = 0; i < n; i++) {
    const a0 = base + i * seg;
    const a1 = a0 + seg;
    wctx.beginPath();
    wctx.moveTo(cx, cy);
    wctx.arc(cx, cy, radius, a0, a1);
    wctx.closePath();
    wctx.fillStyle = COLORS[i % COLORS.length].fill;
    wctx.fill();
    wctx.lineWidth = 2;
    wctx.strokeStyle = CARD;
    wctx.stroke();
  }

  // 2) 칸마다 메뉴 이름 쓰기 (칸 가운데 방향으로 글자를 눕혀서)
  const maxTextWidth = radius * 0.62;        // 글자가 들어갈 수 있는 최대 길이
  const maxFontByAngle = n > 1 ? Math.sin(seg / 2) * radius * 0.55 : radius * 0.2; // 칸 폭에 맞는 최대 크기
  for (let i = 0; i < n; i++) {
    const mid = base + i * seg + seg / 2;    // 칸 가운데 각도
    const label = state.menus[i];

    // 글자가 칸 밖으로 나가지 않도록 크기를 줄여 가며 맞춤
    let fontSize = Math.min(radius * 0.12, 28, maxFontByAngle);
    wctx.font = `700 ${fontSize}px ${FONT}`;
    while (wctx.measureText(label).width > maxTextWidth && fontSize > 10) {
      fontSize -= 1;
      wctx.font = `700 ${fontSize}px ${FONT}`;
    }

    wctx.save();
    wctx.translate(cx, cy);
    wctx.rotate(mid);
    wctx.fillStyle = COLORS[i % COLORS.length].text;
    wctx.textAlign = "right";
    wctx.textBaseline = "middle";
    wctx.fillText(label, radius * 0.86, 0);
    wctx.restore();
  }

  // 3) 바깥 포인트 색 테두리
  wctx.beginPath();
  wctx.arc(cx, cy, radius, 0, TAU);
  wctx.lineWidth = 7;
  wctx.strokeStyle = ACCENT;
  wctx.stroke();

  // 4) 칸 경계마다 작은 밝은 못(동그라미)
  for (let i = 0; i < n; i++) {
    const a = base + i * seg;
    wctx.beginPath();
    wctx.arc(cx + Math.cos(a) * (radius - 1), cy + Math.sin(a) * (radius - 1), Math.max(3, size * 0.008), 0, TAU);
    wctx.fillStyle = CARD;
    wctx.fill();
  }

  // 5) 가운데 둥근 판
  wctx.beginPath();
  wctx.arc(cx, cy, radius * 0.12, 0, TAU);
  wctx.fillStyle = CARD;
  wctx.fill();
  wctx.lineWidth = 4;
  wctx.strokeStyle = ACCENT;
  wctx.stroke();
  wctx.beginPath();
  wctx.arc(cx, cy, radius * 0.045, 0, TAU);
  wctx.fillStyle = ACCENT;
  wctx.fill();
}

/* =============================================================
   룰렛 회전
   ============================================================= */

// 감속 곡선(easeOutQuart): 처음엔 아주 빠르고 끝으로 갈수록 부드럽게 느려짐
function easeOutQuart(t) {
  return 1 - Math.pow(1 - t, 4);
}

// 음수도 0 ~ m 사이로 바꿔 주는 나머지 계산
function mod(a, m) {
  return ((a % m) + m) % m;
}

function startSpin() {
  if (state.spinning) return;

  // 메뉴가 2개 미만이면 시작하지 않음
  if (state.menus.length < MIN_MENUS) {
    showSpinNotice("메뉴를 2개 이상 입력해 주세요");
    return;
  }

  const menus = state.menus.slice();         // 돌기 시작한 순간의 메뉴 목록
  const n = menus.length;
  const seg = TAU / n;

  // ① 버튼을 누르는 순간 당첨 메뉴를 먼저 정함
  const winIndex = Math.floor(Math.random() * n);

  // ② 화살표가 칸의 '안쪽'을 가리키도록, 칸 양 끝 20%를 피해 위치를 고름
  const insideRatio = 0.2 + Math.random() * 0.6;   // 0.2 ~ 0.8
  const targetAngle = (winIndex + insideRatio) * seg; // 12시 기준, 룰렛 위에서의 각도

  /*
   * ③ 최종 회전 각도 계산
   *  - 룰렛을 rotation만큼 시계 방향으로 돌리면, 12시 방향 화살표 아래에는
   *    룰렛 위의 '-rotation' 지점이 오게 됩니다.
   *  - 따라서 최종 rotation ≡ -targetAngle (한 바퀴 단위 무시) 이어야 합니다.
   *  - 지금 각도에서 그 지점까지 시계 방향으로 더 돌아야 하는 양(delta)을 구하고,
   *    충분히 돈 느낌이 나도록 EXTRA_TURNS 바퀴를 더합니다.
   */
  const startRot = state.rotation;
  const wantMod  = mod(-targetAngle, TAU);
  const nowMod   = mod(startRot, TAU);
  const delta    = mod(wantMod - nowMod, TAU);
  const endRot   = startRot + EXTRA_TURNS * TAU + delta;

  // 회전 중에는 버튼 잠금
  state.spinning = true;
  spinNotice.textContent = "";
  render();

  // 카운트다운 시작
  let lastShown = null;
  countdown.classList.add("show");

  const t0 = performance.now();

  function frame(now) {
    const elapsed = now - t0;
    const t = Math.min(elapsed / SPIN_DURATION, 1); // 0 → 1 진행률

    // 감속 곡선에 따라 현재 각도 계산
    state.rotation = startRot + (endRot - startRot) * easeOutQuart(t);
    drawWheel();

    // 남은 시간을 초 단위로 올림 → 5, 4, 3, 2, 1
    const remain = Math.max(1, Math.ceil((SPIN_DURATION - elapsed) / 1000));
    if (remain !== lastShown && t < 1) {
      lastShown = remain;
      countdown.textContent = remain;
      // 숫자가 바뀔 때마다 '톡' 튀어나오는 효과(애니메이션 재시작)
      countdown.classList.remove("pop");
      void countdown.offsetWidth;
      countdown.classList.add("pop");
    }

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      finishSpin(endRot, menus[winIndex]);
    }
  }
  requestAnimationFrame(frame);
}

function finishSpin(endRot, winner) {
  // 정확히 목표 각도에 멈추고, 숫자가 너무 커지지 않도록 한 바퀴 안으로 정리
  state.rotation = mod(endRot, TAU);
  drawWheel();

  countdown.classList.remove("show", "pop");
  countdown.textContent = "";

  state.spinning = false;
  addHistory(winner);
  render();
  openResult(winner);
}

/* =============================================================
   최근 결과 기록 (메모리에만 보관, 새로고침하면 사라짐)
   ============================================================= */
function addHistory(menu) {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  state.history.unshift({ time: `${hh}:${mm}`, menu });  // 최신 결과를 맨 앞에
  state.history = state.history.slice(0, HISTORY_SIZE);  // 5개만 유지
  renderHistory();
}

function renderHistory() {
  historyEl.innerHTML = "";
  if (state.history.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "아직 돌린 기록이 없어요.";
    historyEl.appendChild(li);
    return;
  }
  state.history.forEach((h) => {
    const li = document.createElement("li");
    const tm = document.createElement("time");
    tm.textContent = h.time;
    li.append(tm, document.createTextNode(` - ${h.menu}`));
    historyEl.appendChild(li);
  });
}

/* =============================================================
   결과 팝업
   ============================================================= */
let lastFocus = null;

function openResult(menu) {
  resultText.textContent = `오늘 점심은 ${menu}!`;
  lastFocus = document.activeElement;
  overlay.hidden = false;
  btnAgain.focus();
  launchConfetti();
}

function closeResult() {
  overlay.hidden = true;
  if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
}

btnClose.addEventListener("click", closeResult);
btnAgain.addEventListener("click", () => {
  closeResult();
  startSpin();
});
// 팝업 바깥(어두운 부분)을 누르면 닫기
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeResult();
});
// Esc 키로 닫기, Tab 키는 팝업 안에서만 이동
document.addEventListener("keydown", (e) => {
  if (overlay.hidden) return;
  if (e.key === "Escape") closeResult();
  if (e.key === "Tab") {
    e.preventDefault();
    (document.activeElement === btnAgain ? btnClose : btnAgain).focus();
  }
});

/* =============================================================
   꽃가루 효과 (외부 라이브러리 없이 직접 구현)
   - 화면 가운데에서 위로 터지는 조각 + 위에서 쏟아지는 조각
   - 각 조각은 중력·공기 저항·흔들림·회전을 가지고 움직입니다.
   ============================================================= */
const confettiCanvas = $("confetti");
const cctx = confettiCanvas.getContext("2d");
let particles = [];
let confettiRunning = false;
let confettiLast = 0;

function resizeConfetti() {
  const dpr = window.devicePixelRatio || 1;
  confettiCanvas.width = Math.round(window.innerWidth * dpr);
  confettiCanvas.height = Math.round(window.innerHeight * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function makeParticle(x, y, vx, vy) {
  return {
    x, y, vx, vy,
    size: 6 + Math.random() * 8,                      // 조각 크기
    color: COLORS[Math.floor(Math.random() * COLORS.length)].fill,
    shape: Math.random() < 0.7 ? "rect" : "circle",   // 70%는 네모, 30%는 동그라미
    rot: Math.random() * TAU,                         // 현재 회전 각도
    vr: (Math.random() - 0.5) * 0.3,                  // 회전 속도
    wobble: Math.random() * TAU,                      // 좌우 흔들림 위상
    life: 0
  };
}

function launchConfetti() {
  resizeConfetti();
  const w = window.innerWidth;
  const h = window.innerHeight;
  // 움직임 줄이기 설정을 켠 사용자에게는 조각 수를 줄여서 보여 줌
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const burstCount = reduce ? 30 : 140;
  const rainCount  = reduce ? 20 : 90;

  // 1) 화면 가운데에서 사방으로 터지는 조각
  for (let i = 0; i < burstCount; i++) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3; // 주로 위쪽으로
    const speed = 7 + Math.random() * 9;
    particles.push(makeParticle(w / 2, h / 2, Math.cos(angle) * speed, Math.sin(angle) * speed));
  }
  // 2) 화면 위쪽에서 쏟아지는 조각
  for (let i = 0; i < rainCount; i++) {
    particles.push(makeParticle(Math.random() * w, -20 - Math.random() * h * 0.5,
      (Math.random() - 0.5) * 2, 2 + Math.random() * 3));
  }

  if (!confettiRunning) {
    confettiRunning = true;
    confettiLast = performance.now();
    requestAnimationFrame(stepConfetti);
  }
}

function stepConfetti(now) {
  // 기기 성능과 관계없이 같은 속도가 되도록 경과 시간(프레임 비율)을 곱함
  const dt = Math.min((now - confettiLast) / 16.67, 3);
  confettiLast = now;
  const w = window.innerWidth;
  const h = window.innerHeight;

  cctx.clearRect(0, 0, w, h);

  particles.forEach((p) => {
    p.vy += 0.25 * dt;                 // 중력
    p.vx *= Math.pow(0.985, dt);       // 공기 저항(가로)
    p.vy *= Math.pow(0.99, dt);        // 공기 저항(세로)
    if (p.vy > 6) p.vy = 6;            // 너무 빨리 떨어지지 않게 제한
    p.wobble += 0.1 * dt;
    p.x += (p.vx + Math.sin(p.wobble) * 0.8) * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    p.life += dt;

    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    // 세로 크기를 코사인으로 바꿔 종이가 뒤집히며 펄럭이는 느낌을 냄
    cctx.scale(1, Math.cos(p.wobble * 1.5));
    cctx.fillStyle = p.color;
    if (p.shape === "rect") {
      cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      cctx.beginPath();
      cctx.arc(0, 0, p.size / 3, 0, TAU);
      cctx.fill();
    }
    cctx.restore();
  });

  // 화면 아래로 사라진 조각은 목록에서 제거
  particles = particles.filter((p) => p.y < h + 40 && p.life < 600);

  if (particles.length > 0) {
    requestAnimationFrame(stepConfetti);
  } else {
    confettiRunning = false;
    cctx.clearRect(0, 0, w, h);
  }
}

/* =============================================================
   이벤트 연결
   ============================================================= */
btnAdd.addEventListener("click", addMenu);
btnClear.addEventListener("click", clearMenus);
btnStart.addEventListener("click", startSpin);

input.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  // 한글 입력 중(조합 중)에 Enter가 두 번 처리되는 문제를 막음
  if (e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  addMenu();
});

// 창 크기가 바뀌면 룰렛 해상도를 다시 맞춤
window.addEventListener("resize", () => {
  resizeWheel();
  if (confettiRunning) resizeConfetti();
});

/* ---------- 처음 화면 준비 ---------- */
render();
renderHistory();
resizeWheel();
// 웹폰트가 늦게 도착하면 룰렛 글씨를 그 폰트로 다시 그림
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(drawWheel);
}
</script>
</body>
</html>
